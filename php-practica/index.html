<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALEXIS SPORT - Contacto (PHP)</title>
</head>
<body>
  <h1>ALEXIS SPORT</h1>
  <h2>Contacto</h2>

  <form action="procesar.php" method="POST">
    <p><label>Nombre:<br>
      <input type="text" name="nombre" required></label></p>

    <p><label>Correo electrónico:<br>
      <input type="email" name="correo" required></label></p>

    <p><label>Mensaje:<br>
      <textarea name="mensaje" rows="4" cols="40" required></textarea></label></p>

    <p><button type="submit">Enviar mensaje</button></p>
  </form>
</body>
</html>
